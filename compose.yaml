# Uso: docker compose run --rm tools make <objetivo>
services:
  tools:
    build: docker/tools
    image: veni-mapa-tools
    working_dir: /work
    # Corre con el usuario del host para que build/ no quede de root en Linux.
    # En Docker Desktop (Windows, macOS) el valor por defecto sirve igual.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/work
      - node_modules:/work/node_modules
    environment:
      # Fecha de la build de Protomaps (AAAAMMDD). Vacía = la más reciente.
      BUILD_DATE: ${BUILD_DATE:-}
      # El uid del host no tiene carpeta personal en la imagen.
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"

volumes:
  node_modules:
