version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      tipos:
        patterns: ["@types/*", "typescript"]
  - package-ecosystem: docker
    directory: /docker/tools
    schedule:
      interval: monthly
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
