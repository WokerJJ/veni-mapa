version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      tipos:
        patterns: ["@types/*", "typescript"]
    ignore:
      # Los tipos de Node siguen al Node que corre el pipeline (24, en la imagen
      # y en CI): una mayor nueva se sube a mano junto con Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /docker/tools
    schedule:
      interval: monthly
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # font-maker se compila sobre alpine:X.Y y corre sobre node:24-alpineX.Y:
      # las dos Alpine tienen que ser la misma (libc y FreeType). Dependabot sube
      # cada FROM por separado, así que estas dos se actualizan juntas a mano
      # (README, "Actualizar la imagen de herramientas"). go-pmtiles sigue con
      # Dependabot.
      - dependency-name: "alpine"
      - dependency-name: "node"
