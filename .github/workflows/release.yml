name: Release

# release-please mantiene abierto un PR de release con la próxima versión y el
# CHANGELOG, calculados desde los commits convencionales de main. Al fusionar
# ese PR crea el tag vX.Y.Z y la release, y el job "artefactos" construye el
# mapa de esa versión y lo adjunta.
#
# A mano (workflow_dispatch con un tag existente) vuelve a construir y adjuntar
# los artefactos de esa release, por ejemplo si la subida falló.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release existente a la que volver a adjuntar los artefactos (vX.Y.Z)"
        required: true
        type: string
      build_date:
        description: "Solo si la release no tiene manifest.json: build de Protomaps (AAAAMMDD) en lugar de la de data/build.json (por ejemplo, si Protomaps ya la borró)"
        required: false
        type: string

permissions:
  contents: read

# Una ejecución a la vez y sin cancelar: una release a medio publicar no se
# interrumpe. GitHub deja un solo run pendiente por grupo, así que cada
# re-adjunto manual tiene el suyo y un push a main no lo desplaza.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'main' }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Etiquetas del PR de release (autorelease: pending/tagged).
      issues: write
    # Los PR que abre GITHUB_TOKEN no disparan la CI sola: sus workflows quedan
    # esperando "Approve and run". Con una GitHub App (variable RELEASE_APP_CLIENT_ID y
    # secret RELEASE_APP_PRIVATE_KEY), release-please abre el PR con otra
    # identidad y la CI corre sola. Sin la App, se aprueba a mano (README, Releases).
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Token de la GitHub App
        id: app
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefactos:
    name: Artefactos del mapa
    needs: release-please
    # !cancelled(): en workflow_dispatch release-please se salta y este job igual corre.
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      # Donde se publica cada versión (issue #9): los estilos llevan escrita
      # <TILES_BASE_URL>/vX.Y.Z. Se cambia con la variable de repositorio TILES_BASE_URL.
      TILES_BASE_URL: ${{ vars.TILES_BASE_URL || 'https://tiles.veniroldanillo.co' }}
    steps:
      - name: Versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::tag inválido: '$TAG'"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::no existe la release $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Qué build de Protomaps extraer y qué SHA-256 tiene que dar:
      # - re-adjunto de una release con manifest.json: la de ese manifest; una
      #   versión publicada no cambia de datos.
      # - release sin manifest.json: la de data/build.json del tag, la que aprobó
      #   el último PR de actualización mensual (update.yml). La extracción es
      #   reproducible: misma build, mismo archivo.
      # - release sin manifest.json y build_date a mano (re-adjunto): esa build,
      #   sin SHA-256 esperado. Es la salida si Protomaps ya borró la aprobada.
      - name: Build de Protomaps
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD_DATE: ${{ inputs.build_date }}
        run: |
          set -euo pipefail
          [[ -z "${INPUT_BUILD_DATE:-}" || "$INPUT_BUILD_DATE" =~ ^[0-9]{8}$ ]] || { echo "::error::build_date debe ser AAAAMMDD"; exit 1; }
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          sha=""
          if grep -qx manifest.json <<<"$assets"; then
            [[ -z "${INPUT_BUILD_DATE:-}" ]] || { echo "::error::$TAG ya tiene manifest.json: una versión publicada no cambia de build"; exit 1; }
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP/publicado"
            manifest="$RUNNER_TEMP/publicado/manifest.json"
            build="$(jq -r '.protomaps_build' "$manifest")"
            sha="$(jq -r '.pmtiles as $f | .files[] | select(.name == $f) | .sha256' "$manifest")"
            source="manifest.json publicado en $TAG"
          elif [[ -n "${INPUT_BUILD_DATE:-}" ]]; then
            build="$INPUT_BUILD_DATE"
            source="build_date pedida a mano"
            echo "::warning::$TAG se construye con la build $build pedida a mano, sin SHA-256 esperado"
          elif [[ -f data/build.json ]]; then
            build="$(jq -r '.protomaps_build' data/build.json)"
            sha="$(jq -r '.sha256' data/build.json)"
            source="data/build.json de $TAG"
          else
            echo "::error::$TAG no tiene manifest.json ni data/build.json: volvé a lanzar el workflow con build_date"
            exit 1
          fi
          [[ "$build" =~ ^[0-9]{8}$ && ( -z "$sha" && -n "${INPUT_BUILD_DATE:-}" || "$sha" =~ ^[0-9a-f]{64}$ ) ]] \
            || { echo "::error::$source sin build o SHA-256 válidos"; exit 1; }
          echo "Build $build ($source)"
          echo "BUILD_DATE=$build" >>"$GITHUB_ENV"
          echo "EXPECTED_PMTILES_SHA=$sha" >>"$GITHUB_ENV"
      - name: Usuario del runner para el contenedor
        run: |
          echo "HOST_UID=$(id -u)" >>"$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >>"$GITHUB_ENV"
          mkdir -p node_modules
      - uses: docker/setup-buildx-action@v4
      - name: Imagen de herramientas
        uses: docker/build-push-action@v7
        with:
          context: docker/tools
          tags: veni-mapa-tools
          load: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      - name: Caché de recursos de terceros
        uses: actions/cache@v6
        with:
          path: build/cache/assets
          key: assets-${{ hashFiles('config/assets.lock') }}
      # El extracto de Colombia de Geofabrik pesa ~330 MB: se restaura el último
      # que guardó la CI de main, y routing-source.sh lo usa solo si coincide con
      # el MD5 del archivo del día (si no, baja el nuevo).
      - name: Caché de OSM
        id: osm-cache
        uses: actions/cache/restore@v6
        with:
          path: build/cache/osm
          key: osm-restaurar
          restore-keys: osm-
      - name: make routing
        run: docker compose run --rm tools make routing
      - name: make extract assets style
        run: |
          docker compose run --rm tools make extract assets style \
            STYLE_BASE_URL="$TILES_BASE_URL/v$VERSION" STYLE_VERSION="$VERSION"
      # Lo que se adjunta pasa por la misma verificación que en CI.
      - name: make verify
        run: docker compose run --rm tools make verify
      - name: make release
        run: docker compose run --rm tools make release RELEASE_VERSION="$VERSION"
      - name: Verificación de dist/
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          jq -e --arg v "$VERSION" '.version == $v' dist/manifest.json
          if [[ -n "$EXPECTED_PMTILES_SHA" ]]; then
            jq -e --arg sha "$EXPECTED_PMTILES_SHA" '.pmtiles as $f | .files[] | select(.name == $f) | .sha256 == $sha' dist/manifest.json \
              || { echo "::error::el extracto no da el SHA-256 esperado para la build $BUILD_DATE (¿cambió la región o go-pmtiles?)"; exit 1; }
          fi
          jq . dist/manifest.json
      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.TAG }}
          path: dist
          retention-days: 7

  # Cloudflare R2 (issue #9): preparado y desactivado. Sin los cuatro secrets
  # R2_* el script avisa y termina bien; ver docs/PUBLICACION.md.
  r2:
    name: Publicación en R2
    needs: [release-please, artefactos]
    if: ${{ !cancelled() && needs.artefactos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Una sola publicación en R2 a la vez, de cualquier tag: dos corridas
    # juntas mezclarían los archivos de latest/.
    concurrency:
      group: r2
      cancel-in-progress: false
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      # El script es el de este workflow, no el del tag: de la release solo se
      # toman los datos (dist/), así las correcciones valen también al re-adjuntar.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ env.TAG }}
          path: dist
      # aws (CLI v2) viene instalado en los runners de Ubuntu.
      - name: Subir a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: scripts/r2-publish.sh dist
