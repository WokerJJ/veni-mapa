name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      # En Windows git no registra permisos: un script nuevo puede llegar sin
      # bit de ejecución y fallar solo en Linux.
      - name: Scripts ejecutables
        run: |
          if git ls-files -s 'scripts/*.sh' 'tests/*_test.sh' | grep -v '^100755'; then
            echo "::error::Scripts sin bit de ejecución: git update-index --chmod=+x <archivo>"
            exit 1
          fi

  region:
    name: Región (config/region.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # yq v4 (mikefarah) viene instalado en los runners de Ubuntu.
      - name: Herramientas
        run: |
          yq --version
          sudo apt-get install -y -qq gawk mawk >/dev/null
          # Locales con coma decimal: mawk convertía -76.30 en -76 con ellos.
          sudo locale-gen es_CO.UTF-8 de_DE.UTF-8 >/dev/null
      - name: Pruebas con mawk
        run: AWK=mawk bash tests/region_test.sh
      - name: Pruebas con gawk
        run: AWK=gawk bash tests/region_test.sh
      - name: Pruebas con mawk y locale es_CO
        run: AWK=mawk LC_ALL=es_CO.UTF-8 bash tests/region_test.sh

  # El pipeline corre en la misma imagen de herramientas que se usa en local,
  # así CI y desarrollo comparten versiones de make, yq, jq y pmtiles.
  #
  # La extracción contra la build real de Protomaps es intencional: es lo que el
  # pipeline produce. Las pruebas de los scripts, en cambio, no usan red.
  pipeline:
    name: Pipeline (imagen de herramientas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Usuario del runner para el contenedor
        run: |
          echo "HOST_UID=$(id -u)" >>"$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # Caché de capas en GitHub Actions: la imagen solo se reconstruye cuando
      # cambia el Dockerfile.
      - name: Imagen de herramientas
        uses: docker/build-push-action@v7
        with:
          context: docker/tools
          tags: veni-mapa-tools
          load: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      - name: make help y make clean funcionan sin generar la región
        run: |
          docker compose run --rm tools make help | grep -q '^Uso:'
          docker compose run --rm tools make clean
      # Las descargas de fuentes y sprites solo cambian cuando cambia el lock.
      # assets.sh vuelve a verificar el SHA-256 de lo restaurado.
      - name: Caché de recursos de terceros
        uses: actions/cache@v6
        with:
          path: build/cache/assets
          key: assets-${{ hashFiles('config/assets.lock') }}
      - name: make assets
        run: docker compose run --rm tools make assets
      # Sin red: las pruebas usan índices y recursos locales. La prueba completa
      # de assets.sh usa las fuentes que dejó make assets, y aquí no puede omitirse.
      - name: Pruebas en la imagen
        run: |
          for test in tests/*_test.sh; do
            echo "::group::$test"
            docker compose run --rm -e ASSETS_TEST_REQUIRE_FULL=1 tools bash "$test"
            echo "::endgroup::"
          done
      - name: Verificación de los recursos
        shell: bash
        run: |
          set -euo pipefail
          # font-maker escribe los 256 rangos aunque estén vacíos: se verifica
          # contenido. El cirílico (1024-1279) solo lo aporta el respaldo de Noto.
          mapfile -t stacks < <(yq -r 'keys[]' config/fontstacks.yml)
          test "${#stacks[@]}" -gt 0
          for stack in "${stacks[@]}"; do
            bytes="$(stat -c %s "build/assets/fonts/$stack/1024-1279.pbf")"
            echo "$stack: rango cirílico de $bytes bytes"
            test "$bytes" -gt 1024
          done
          for sprite in light light@2x dark dark@2x; do
            jq -e 'length > 0' "build/assets/sprites/$sprite.json" >/dev/null
            test -s "build/assets/sprites/$sprite.png"
          done
          for license in licenses/*.txt; do
            cmp "$license" "build/assets/licenses/$(basename "$license")"
          done
          jq -e '.glyphs_sha256 | test("^[0-9a-f]{64}$")' build/assets/assets.json
      - name: make extract
        run: docker compose run --rm tools make extract
      # Tipos y pruebas del generador (sin red) y los cuatro estilos.
      - name: make check
        run: docker compose run --rm tools make check
      - name: make style
        run: docker compose run --rm tools make style
      - name: Verificación de los estilos
        shell: bash
        run: |
          set -euo pipefail
          for variant in claro oscuro; do
            for lang in es en; do
              file="build/style/veni-$variant-$lang.json"
              jq -e --arg v "$variant" --arg l "$lang"                 '.version == 8 and .metadata["veni:variant"] == $v and .metadata["veni:lang"] == $l
                 and (.layers | length) > 50 and (.sources.protomaps.url | startswith("pmtiles://"))' "$file" >/dev/null
              echo "$file: $(jq '.layers | length' "$file") capas"
            done
          done
      - name: Verificación del extracto
        run: |
          name="$(yq -r .name config/region.yml)"
          test -s "build/$name.pmtiles"
          # Los archivos generados son del usuario del runner, no de root.
          test "$(stat -c %u build/build.json)" = "$(id -u)"
          jq -e --arg sha "$(sha256sum "build/$name.pmtiles" | cut -d' ' -f1)" \
            '.sha256 == $sha and .bytes > 0 and (.protomaps_build | test("^[0-9]{8}$"))' build/build.json
          docker compose run --rm tools pmtiles show "build/$name.pmtiles"
          cat build/extract-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: extracto
          path: |
            build/*.pmtiles
            build/extract-report.txt
            build/build.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: estilos
          path: build/style
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: recursos
          path: build/assets
          retention-days: 7

  # Único check obligatorio en la protección de main: agrega el resultado de
  # todos los jobs, así sumar jobs nuevos no obliga a tocar la protección.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [actionlint, region, pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los jobs pasaron
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Algún job falló o se canceló"; exit 1
          fi
